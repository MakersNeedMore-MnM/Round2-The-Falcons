services:
  - type: web
    name: cascadia-demo
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    dockerCommand: node apps/api/dist/migrate.js && node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_STORE
        value: postgres
      - key: SERVE_WEB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cascadia-demo-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: OBSERVABILITY_TOKEN
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: NOTIFICATION_WEBHOOK_PROVIDER
        value: generic
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
databases:
  - name: cascadia-demo-postgres
    plan: free
    databaseName: cascadia
    user: cascadia
