services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cascadia
      POSTGRES_USER: cascadia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascadia -d cascadia"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cascadia-postgres:/var/lib/postgresql/data

volumes:
  cascadia-postgres:
