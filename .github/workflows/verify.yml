name: Verify Cascadia

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cascadia
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cascadia -d cascadia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATA_STORE: postgres
      DATABASE_URL: postgresql://cascadia:ci-only-password@127.0.0.1:5432/cascadia
      JWT_SECRET: ci-jwt-secret-at-least-thirty-two-characters
      INTEGRATION_ENCRYPTION_KEY: ci-integration-key-at-least-thirty-two-characters
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @cascadia/contracts
      - run: npm run migrate -w @cascadia/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --check
